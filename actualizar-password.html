<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer Contraseña - Pronósticos SoftMedia</title>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white text-slate-800 font-sans min-h-screen flex flex-col justify-between p-6 relative overflow-hidden">
  
  <!-- Espaciador Superior -->
  <div class="hidden md:block"></div>

  <!-- Contenedor de la Tarjeta -->
  <div class="max-w-sm w-full mx-auto flex flex-col items-center my-auto">
    <!-- Logo de SoftMedia -->
    <img 
      src="./images/logotipo.png" 
      alt="SoftMedia" 
      class="h-12 w-auto mb-6 object-contain select-none pointer-events-none" 
    />

    <!-- Tarjeta Blanca Flotante con Borde y Sombra Más Notoria -->
    <div class="relative z-10 w-full p-8 rounded-2xl border border-slate-100 bg-white shadow-[0_20px_50px_rgba(0,0,0,0.15)]">
      <!-- Título de la Tarjeta -->
      <div class="mb-8 text-center">
        <h1 class="text-2xl font-black font-outfit tracking-tight text-slate-800 uppercase leading-none mb-1.5">
          Crea tu nueva contraseña
        </h1>
        <p class="text-xs text-slate-400 font-medium">Ingresa tu nuevo acceso de seguridad</p>
      </div>

      <!-- Formulario de Recuperación -->
      <div class="space-y-6">
        <div class="relative">
          <input 
            type="password" 
            id="nueva_password_field" 
            required
            placeholder="Mínimo 6 caracteres" 
            class="w-full bg-white border-2 border-slate-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-xl px-4 py-3.5 text-sm text-slate-800 placeholder:text-slate-400 shadow-[inset_0_2px_4px_rgba(0,0,0,0.06)] focus:shadow-none transition-all font-semibold" 
          />
        </div>

        <button 
          type="button"
          onclick="guardarNuevaPasswordDesdeEnlace()"
          class="w-full bg-emerald-600 border-b-4 border-emerald-800 text-white rounded-xl py-3.5 text-xs font-black uppercase tracking-widest shadow-md hover:bg-emerald-500 hover:border-emerald-700 active:translate-y-[2px] active:border-b-2 transition-all flex items-center justify-center space-x-2">
          <span>Guardar Nueva Contraseña</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="text-[9px] font-bold uppercase tracking-wider text-slate-400 text-center mt-8 md:mt-0">
    © 2026 SOFTMEDIA FORCE. TODOS LOS DERECHOS RESERVADOS.
  </div>

  <!-- Carga del Script de Lógica -->
  <script type="module" src="./actualizar-password.js"></script>
</body>
</html>
