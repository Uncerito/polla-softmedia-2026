<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pronósticos SoftMedia - Mundial 2026</title>
  <!-- Limpieza de Caché y Datos por Cambio de Base de Datos -->
  <script>
    (async () => {
      const CURRENT_DB = 'https://oefldbmikcdhrdmatrsx.supabase.co';
      const savedDb = localStorage.getItem('pollita_db_url');
      if (savedDb !== CURRENT_DB) {
        localStorage.clear();
        sessionStorage.clear();
        localStorage.setItem('pollita_db_url', CURRENT_DB);
      }
      if ('caches' in window) {
        try {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        } catch (e) {
          console.error('Error limpiando Cache API:', e);
        }
      }
    })();
  </script>
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              pitch: 'var(--bg-dark)',
              green: 'var(--brand-green)',
              neonGreen: 'var(--accent-green)',
              blue: 'var(--accent-blue)',
              purple: 'var(--brand-blue)',
              gold: 'var(--brand-gold)',
              accent: 'var(--accent-red)',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <!-- Estilos Personalizados del Mundial -->
  <link rel="stylesheet" href="styles.css?v=1.2.0">
  <!-- Chart.js para Cuadros Estadísticos Profesionales -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Importmap para ESM -->

    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "htm": "https://esm.sh/htm@3.1.1",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0",
        "./supabase.js": "./supabase.js?v=1.1.0"
      }
    }
  </script>
</head>

        CARGANDO MUNDIAL 2026 - SOFTMEDIA...

  <!-- Script principal de la aplicación -->
